name = "ash-tabletop-announcements"
main = "src/index.js"
compatibility_date = "2024-09-23"

[vars]
FIREBASE_PROJECT_ID = "ash-ttrpg"
ADMIN_UID = "VHPYS7qmjoNugPZ86hNppMWiW6k1"
ALLOWED_ORIGIN = "https://ashtabletop.com,http://localhost:5500"
# The Firebase web key. It is public by design (it is in firebase-init.js too); the Worker uses it
# only to ask Firebase when a signed-in account was created, to spot brand-new sign-ups.
FIREBASE_API_KEY = "AIzaSyAnMtB4mvPqzhPq5rtgQ-6XgjY1uaz1mp0"

WHOP_COMPANY_ID = "biz_iSafQUiIY2ST8C"
WHOP_PRODUCT_ID = "prod_WkFRIyVpCDiJo"
TEST_PLAYER_EMAILS = "biancas@me.com"

# Open to everyone (2026-09-28, Ash's go-ahead): anyone signed in can now book
# a seat and save a card, not just the admin + TEST_PLAYER_EMAILS.
PAY_OPEN = "yes"
# Review invite emails are ON (Ash approved them on 2026-10-29). Set to "off" to stop them.
REVIEW_INVITES = "on"

# Card-on-file system. PAY_MODE "sandbox" = pretend money at sandbox.whop.com,
# "live" = real money. CHARGING_MODE: "off" (never charge), "dry" (log what it
# would charge, charge nothing), "on" (really charge).
PAY_MODE = "live"
CHARGING_MODE = "on"
WHOP_SANDBOX_COMPANY_ID = "biz_A06wLWpjYsaAxB"

# Stripe: the second payment provider, for brand-new campaigns only. STRIPE_MODE picks test vs
# live, same idea as PAY_MODE above. The publishable key is not sensitive (same reasoning as
# FIREBASE_API_KEY above) so it lives here; the secret keys are set with:
#   wrangler secret put STRIPE_SECRET_KEY
#   wrangler secret put STRIPE_TEST_SECRET_KEY
STRIPE_MODE = "live"
STRIPE_PUBLISHABLE_KEY = "pk_live_51UfM8DHJ6eHA5F3PmmlpcoErUsyeSo0N43nYD7XfbuPEWl3UUAsgZoiWrFHPDem57VDink5tZXSDW911SEAcAPo000smUNXoZq"
STRIPE_TEST_PUBLISHABLE_KEY = "pk_test_51UfLXhQactbVzNVTTShC9v29yCsdP3IA5RRClias89lGgIUUYD3DnRsQbbM0RxZoaWfPtBSWnVRlhkPqjiPL1uvn000vxCoIhI"

# EMAIL_API_KEY is a secret, never stored here.
# Set it once with: wrangler secret put EMAIL_API_KEY

[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "ash-tabletop-pay"
database_id = "f709f540-fd5b-4838-b4a2-a4268b3f28e4"
