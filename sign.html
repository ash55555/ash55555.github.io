<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Table sign | Ash Tabletop</title>
<style>
  @page { size: auto; margin: 12mm; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: #e9edf2; color: #10223a; font-family: Georgia, "Times New Roman", serif; min-height: 100vh; padding: 20px 16px 40px; }
  .bar { max-width: 640px; margin: 0 auto 18px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: space-between; font-family: Arial, sans-serif; }
  .bar p { margin: 0; font-size: 15px; color: #3a4659; flex: 1 1 260px; }
  .bar button { font: inherit; font-weight: 700; font-size: 16px; padding: .75em 1.4em; border: 0; border-radius: 12px; background: #f4b740; color: #1a1208; cursor: pointer; }
  .bar button:active { transform: scale(.97); }
  .sign { width: min(170mm, 100%); margin: 0 auto; border: 2.5mm solid #10223a; border-radius: 8mm; padding: 12mm 10mm; background: #fff; text-align: center; }
  .eyebrow { font: 700 4.2mm/1 Arial, sans-serif; letter-spacing: .35em; text-transform: uppercase; color: #b9791a; margin: 0 0 6mm; }
  h1 { font-size: clamp(30px, 15mm, 15mm); line-height: 1.05; margin: 0 0 4mm; overflow-wrap: anywhere; }
  .tag { font-size: 5.2mm; font-style: italic; margin: 0 auto 8mm; max-width: 130mm; }
  #qr { width: min(100mm, 70vw); height: min(100mm, 70vw); display: block; margin: 0 auto; border: 1.5mm solid #10223a; border-radius: 4mm; background: #fff; }
  .scan { font: 700 6.5mm/1.2 Arial, sans-serif; margin: 8mm 0 2mm; }
  .url { font: 4.4mm/1.3 Arial, sans-serif; word-break: break-all; color: #334; margin: 0; }
  .foot { font: 3.6mm/1 Arial, sans-serif; letter-spacing: .3em; text-transform: uppercase; margin: 9mm 0 0; color: #778; }
  @media print {
    body { background: #fff; padding: 0; min-height: 0; display: flex; align-items: center; justify-content: center; height: 100vh; }
    .bar { display: none; }
    .sign { width: 170mm; }
  }
</style>
</head>
<body>
  <div class="bar">
    <p>Print this page for a desk, a booth or a wall. Anyone who scans it lands on the page below.</p>
    <button type="button" id="print">Print this sign</button>
  </div>
  <main class="sign">
    <p class="eyebrow">Tabletop role-playing</p>
    <h1 id="title">Play D&amp;D with us</h1>
    <p class="tag" id="tag">Every story needs a party. Come build one with us.</p>
    <canvas id="qr" width="1000" height="1000" aria-label="QR code"></canvas>
    <p class="scan">Point your phone camera here</p>
    <p class="url" id="url"></p>
    <p class="foot">Ash Tabletop</p>
  </main>
<script src="qrcode.js?v=20261116a"></script>
<script>
(function () {
  var WORKER = 'https://ash-tabletop-announcements.ash-tabletop.workers.dev';
  var slug = (new URLSearchParams(window.location.search).get('slug') || 'ash').toLowerCase().replace(/[^a-z0-9-]/g, '') || 'ash';
  var link = 'https://ashtabletop.com/' + (slug === 'ash' ? 'ash.html' : 'gm.html?slug=' + encodeURIComponent(slug));

  function draw() {
    var c = document.getElementById('qr'), qr = qrcode(0, 'M'); qr.addData(link); qr.make();
    var size = 1000, n = qr.getModuleCount(), cell = Math.floor(size / (n + 8)), pad = Math.floor((size - cell * n) / 2), g = c.getContext('2d');
    g.fillStyle = '#fff'; g.fillRect(0, 0, size, size); g.fillStyle = '#10223a';
    for (var r = 0; r < n; r++) for (var k = 0; k < n; k++) if (qr.isDark(r, k)) g.fillRect(pad + k * cell, pad + r * cell, cell, cell);
  }
  draw();
  document.getElementById('url').textContent = link.replace(/^https:\/\//, '');
  document.getElementById('print').addEventListener('click', function () { window.print(); });

  // The Game Master's own name and tagline, when their page has them.
  fetch(WORKER + '/gm/public?slug=' + encodeURIComponent(slug))
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) {
      var p = d && d.profile;
      if (slug === 'ash' && !(p && p.name)) p = { name: 'Ash' };
      if (!p) return;
      if (p.name) { document.getElementById('title').textContent = 'Play D&D with ' + p.name; document.title = 'Table sign: ' + p.name; }
      if (p.tagline) document.getElementById('tag').textContent = p.tagline;
    })
    .catch(function () {});
})();
</script>
</body>
</html>
